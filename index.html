<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station — LASER IT</title>
<meta name="description" content="Station is a music workstation that runs in a browser tab. Cut it open along its own seams and every mode it holds comes out of the same place.">
<meta name="color-scheme" content="dark">
<script>document.documentElement.classList.remove('no-js')</script>
<link rel="preload" as="image" type="image/webp" href="media/station/final/station-laser-loaded.webp" fetchpriority="high">
<link rel="preload" as="image" type="image/webp" href="media/station/final/station-laser-cut.webp">
<link rel="stylesheet" href="styles/site.css">
</head>
<body>

<!--
  Scene 00 + Scene 01. TECHNICAL_PRINCIPLES.md section 15: prove the riskiest
  interaction before building page volume.

  One LASER IT does the whole reveal. The chassis is identical in every mode
  capture — verified pixel by pixel — and only the area below the view tabs
  changes, so that area is treated as a magazine of states: six modes stacked
  exactly on top of one another until the cut opens the machine.

  TODO(content): the masthead still needs the builder's byline. Left out rather
  than invented — ASSET_PLAN.md "Missing-content rule".
-->

<main class="stage" id="stage" data-state="intact">

  <header class="masthead">
    <div class="masthead__object">
      <h1 class="wordmark">Station</h1>
      <p class="tagline">A music workstation that runs in a browser tab</p>
    </div>
    <p class="readout" role="status" aria-live="polite" aria-atomic="true">
      <span class="readout__lamp" aria-hidden="true"></span>
      <span id="readoutText">Source loaded · 1 slice</span>
    </p>
  </header>

  <div class="theatre">
    <figure class="object">
      <div class="rig">
        <div class="frame" role="img"
             aria-label="Station shown as one tall instrument: transport row, readout, project and bank row, the seven view tabs, a waveform display, the CUT slider and a sixteen-pad slice map.">

          <!--
            Eight layers. Each holds a full copy of the same image and shows only
            its own band of it, so untouched they tile the frame exactly and read
            as one screen. Every cut falls in a real gap between Station's chassis
            modules, so no control is bisected.

            01-04 are the chassis, which is the same in every mode.
            05-08 are the core: the area the active tab controls.
          -->
          <div class="slices">
            <div class="slice slice--chassis chop chop--1 slice--first" style="--i:1"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice slice--chassis chop chop--2" style="--i:2"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice slice--chassis chop chop--3" style="--i:3"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice slice--chassis chop chop--4" style="--i:4"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice slice--core chop chop--5" style="--i:5"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice slice--core chop chop--6" style="--i:6"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice slice--core chop chop--7" style="--i:7"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice slice--core chop chop--8 slice--last" style="--i:8"><i class="face face--before"></i><i class="face face--after"></i></div>
          </div>

          <!--
            The deck. Every plate is the same rectangle as the core, so before the
            reveal all six lie exactly on top of one another and on top of the
            core itself. --n is the deal order; PADS goes last so it lands in
            front. The LASER plate carries no image: the four core layers already
            hold that state, and this element only carries its label so the label
            travels with them.
          -->
          <ul class="deck" id="deck">
            <li class="plate plate--mix"   style="--n:1"><i class="plate__face"></i><span class="chip">Mix</span></li>
            <li class="plate plate--song"  style="--n:2"><i class="plate__face"></i><span class="chip">Song</span></li>
            <li class="plate plate--seq"   style="--n:3"><i class="plate__face"></i><span class="chip">Seq</span></li>
            <li class="plate plate--synth" style="--n:4"><i class="plate__face"></i><span class="chip">Synth</span></li>
            <li class="plate plate--pads"  style="--n:5"><i class="plate__face"></i><span class="chip">Pads</span></li>
            <li class="plate plate--laser" style="--n:0"><span class="chip">Laser</span></li>
          </ul>

          <!-- the laser: target brackets, one travelling beam, seven cuts -->
          <svg class="beams" viewBox="0 0 451 900" aria-hidden="true" focusable="false">
            <g class="target">
              <path d="M5 31V5h26M420 5h26v26M446 869v26h-26M31 895H5v-26"/>
            </g>
            <g class="cutline" style="--p:.06644">
              <line class="cutline__halo" x1="2" y1="59.8" x2="449" y2="59.8"/>
              <line class="cutline__core" x1="2" y1="59.8" x2="449" y2="59.8"/>
              <circle class="cutline__pin" cx="8" cy="59.8" r="3.6"/><circle class="cutline__pin" cx="443" cy="59.8" r="3.6"/>
            </g>
            <g class="cutline" style="--p:.11500">
              <line class="cutline__halo" x1="2" y1="103.5" x2="449" y2="103.5"/>
              <line class="cutline__core" x1="2" y1="103.5" x2="449" y2="103.5"/>
              <circle class="cutline__pin" cx="8" cy="103.5" r="3.6"/><circle class="cutline__pin" cx="443" cy="103.5" r="3.6"/>
            </g>
            <g class="cutline" style="--p:.17426">
              <line class="cutline__halo" x1="2" y1="156.83" x2="449" y2="156.83"/>
              <line class="cutline__core" x1="2" y1="156.83" x2="449" y2="156.83"/>
              <circle class="cutline__pin" cx="8" cy="156.83" r="3.6"/><circle class="cutline__pin" cx="443" cy="156.83" r="3.6"/>
            </g>
            <g class="cutline cutline--core" style="--p:.24589">
              <line class="cutline__halo" x1="2" y1="221.3" x2="449" y2="221.3"/>
              <line class="cutline__core" x1="2" y1="221.3" x2="449" y2="221.3"/>
              <circle class="cutline__pin" cx="8" cy="221.3" r="3.6"/><circle class="cutline__pin" cx="443" cy="221.3" r="3.6"/>
            </g>
            <g class="cutline" style="--p:.44422">
              <line class="cutline__halo" x1="2" y1="399.8" x2="449" y2="399.8"/>
              <line class="cutline__core" x1="2" y1="399.8" x2="449" y2="399.8"/>
              <circle class="cutline__pin" cx="8" cy="399.8" r="3.6"/><circle class="cutline__pin" cx="443" cy="399.8" r="3.6"/>
            </g>
            <g class="cutline" style="--p:.51500">
              <line class="cutline__halo" x1="2" y1="463.5" x2="449" y2="463.5"/>
              <line class="cutline__core" x1="2" y1="463.5" x2="449" y2="463.5"/>
              <circle class="cutline__pin" cx="8" cy="463.5" r="3.6"/><circle class="cutline__pin" cx="443" cy="463.5" r="3.6"/>
            </g>
            <g class="cutline" style="--p:.70367">
              <line class="cutline__halo" x1="2" y1="633.3" x2="449" y2="633.3"/>
              <line class="cutline__core" x1="2" y1="633.3" x2="449" y2="633.3"/>
              <circle class="cutline__pin" cx="8" cy="633.3" r="3.6"/><circle class="cutline__pin" cx="443" cy="633.3" r="3.6"/>
            </g>
          </svg>

          <div class="beam" aria-hidden="true"></div>
          <div class="flash" aria-hidden="true"></div>
        </div>
        <div class="cast" aria-hidden="true"></div>
      </div>

      <figcaption class="visually-hidden">
        Station cut along its own construction seams into eight layers, four of
        them chassis and four of them the area the active tab controls. That area
        turns out to hold six states of the same machine: laser, pads, synth,
        seq, song and mix.
      </figcaption>
    </figure>
  </div>

  <div class="controls">
    <button class="trigger" id="laserIt" type="button">
      <span class="trigger__label" id="triggerLabel">Laser it</span>
      <span class="trigger__meta" id="triggerMeta">cut 8</span>
      <span class="trigger__charge" aria-hidden="true"></span>
    </button>
    <p class="hint" id="hint">One pass. Eight layers, and everything the tabs were keeping out of sight.</p>
  </div>

</main>

<script src="scripts/laser.js" defer></script>
</body>
</html>
