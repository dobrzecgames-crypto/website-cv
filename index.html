<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station — LASER IT</title>
<meta name="description" content="Station is a music workstation that runs in a browser tab. Cut it open along its own seams and look inside.">
<meta name="color-scheme" content="dark">
<script>document.documentElement.classList.remove('no-js')</script>
<link rel="preload" as="image" type="image/webp" href="media/station/final/station-laser-loaded.webp" fetchpriority="high">
<link rel="preload" as="image" type="image/webp" href="media/station/final/station-laser-cut.webp">
<link rel="stylesheet" href="styles/site.css">
</head>
<body>

<!--
  Scene 00 + Scene 01 only. Prototype of the riskiest interaction, per
  TECHNICAL_PRINCIPLES.md §15: intact Station -> LASER IT -> meaningful layers.

  TODO(content): the masthead still needs the builder's byline. Left out rather
  than invented — ASSET_PLAN.md "Missing-content rule".
-->

<main class="stage" id="stage" data-state="intact">

  <header class="masthead">
    <div class="masthead__object">
      <h1 class="wordmark">Station</h1>
      <p class="tagline">A music workstation that runs in a browser tab</p>
    </div>
    <p class="readout" role="status" aria-live="polite" aria-atomic="true">
      <span class="readout__lamp" aria-hidden="true"></span>
      <span id="readoutText">Source loaded · 1 slice</span>
    </p>
  </header>

  <div class="theatre">
    <div class="theatre__void" aria-hidden="true"></div>

    <figure class="object">
      <div class="rig">
        <div class="frame" role="img"
             aria-label="Station shown as one tall instrument: transport row, readout, project and bank row, the seven view tabs, a waveform display, the CUT slider, the manual-slice controls and a sixteen-pad slice map.">

          <!--
            Eight fragments. Each one holds a full copy of the same image and
            shows only its own band of it, so untouched they tile the frame
            exactly and read as a single screen. The cut lines fall in the real
            gaps between Station's modules, so every fragment survives as a
            complete part of the instrument rather than a strip of pixels.
          -->
          <div class="slices">
            <div class="slice chop chop--1 slice--first" style="--i:1"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice chop chop--2" style="--i:2"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice chop chop--3" style="--i:3"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice chop chop--4" style="--i:4"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice chop chop--5" style="--i:5"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice chop chop--6" style="--i:6"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice chop chop--7" style="--i:7"><i class="face face--before"></i><i class="face face--after"></i></div>
            <div class="slice chop chop--8 slice--last" style="--i:8"><i class="face face--before"></i><i class="face face--after"></i></div>
          </div>

          <div class="marks" aria-hidden="true">
            <span class="mark chop chop--1" style="--i:1">01</span>
            <span class="mark chop chop--2" style="--i:2">02</span>
            <span class="mark chop chop--3" style="--i:3">03</span>
            <span class="mark chop chop--4" style="--i:4">04</span>
            <span class="mark chop chop--5" style="--i:5">05</span>
            <span class="mark chop chop--6" style="--i:6">06</span>
            <span class="mark chop chop--7" style="--i:7">07</span>
            <span class="mark chop chop--8" style="--i:8">08</span>
          </div>

          <!-- the laser itself: target brackets, one travelling beam, seven cuts -->
          <svg class="beams" viewBox="0 0 451 900" aria-hidden="true" focusable="false">
            <g class="target">
              <path d="M5 31V5h26M420 5h26v26M446 869v26h-26M31 895H5v-26"/>
            </g>
            <g class="cutline" style="--p:.06644">
              <line class="cutline__halo" x1="2" y1="59.8" x2="449" y2="59.8"/>
              <line class="cutline__core" x1="2" y1="59.8" x2="449" y2="59.8"/>
              <circle class="cutline__pin" cx="8" cy="59.8" r="3.6"/><circle class="cutline__pin" cx="443" cy="59.8" r="3.6"/>
            </g>
            <g class="cutline" style="--p:.11500">
              <line class="cutline__halo" x1="2" y1="103.5" x2="449" y2="103.5"/>
              <line class="cutline__core" x1="2" y1="103.5" x2="449" y2="103.5"/>
              <circle class="cutline__pin" cx="8" cy="103.5" r="3.6"/><circle class="cutline__pin" cx="443" cy="103.5" r="3.6"/>
            </g>
            <g class="cutline" style="--p:.17426">
              <line class="cutline__halo" x1="2" y1="156.83" x2="449" y2="156.83"/>
              <line class="cutline__core" x1="2" y1="156.83" x2="449" y2="156.83"/>
              <circle class="cutline__pin" cx="8" cy="156.83" r="3.6"/><circle class="cutline__pin" cx="443" cy="156.83" r="3.6"/>
            </g>
            <g class="cutline" style="--p:.24589">
              <line class="cutline__halo" x1="2" y1="221.3" x2="449" y2="221.3"/>
              <line class="cutline__core" x1="2" y1="221.3" x2="449" y2="221.3"/>
              <circle class="cutline__pin" cx="8" cy="221.3" r="3.6"/><circle class="cutline__pin" cx="443" cy="221.3" r="3.6"/>
            </g>
            <g class="cutline" style="--p:.44422">
              <line class="cutline__halo" x1="2" y1="399.8" x2="449" y2="399.8"/>
              <line class="cutline__core" x1="2" y1="399.8" x2="449" y2="399.8"/>
              <circle class="cutline__pin" cx="8" cy="399.8" r="3.6"/><circle class="cutline__pin" cx="443" cy="399.8" r="3.6"/>
            </g>
            <g class="cutline" style="--p:.51500">
              <line class="cutline__halo" x1="2" y1="463.5" x2="449" y2="463.5"/>
              <line class="cutline__core" x1="2" y1="463.5" x2="449" y2="463.5"/>
              <circle class="cutline__pin" cx="8" cy="463.5" r="3.6"/><circle class="cutline__pin" cx="443" cy="463.5" r="3.6"/>
            </g>
            <g class="cutline" style="--p:.70367">
              <line class="cutline__halo" x1="2" y1="633.3" x2="449" y2="633.3"/>
              <line class="cutline__core" x1="2" y1="633.3" x2="449" y2="633.3"/>
              <circle class="cutline__pin" cx="8" cy="633.3" r="3.6"/><circle class="cutline__pin" cx="443" cy="633.3" r="3.6"/>
            </g>
          </svg>

          <div class="beam" aria-hidden="true"></div>
          <div class="flash" aria-hidden="true"></div>
        </div>
        <div class="cast" aria-hidden="true"></div>
      </div>

      <figcaption class="visually-hidden">
        Station cut along its own construction seams into eight layers: transport,
        readout, project, views, waveform, cut, slices and pads.
      </figcaption>
    </figure>

    <!-- the slice index. eight numbered layers in four columns and two rows —
         the same shape pads 01 to 08 occupy in Station's own pad map. -->
    <ol class="index" id="index">
      <li class="index__item" style="--i:1"><span class="index__n">01</span><span class="index__name">Transport</span></li>
      <li class="index__item" style="--i:2"><span class="index__n">02</span><span class="index__name">Display</span></li>
      <li class="index__item" style="--i:3"><span class="index__n">03</span><span class="index__name">Project</span></li>
      <li class="index__item" style="--i:4"><span class="index__n">04</span><span class="index__name">Views</span></li>
      <li class="index__item" style="--i:5"><span class="index__n">05</span><span class="index__name">Waveform</span></li>
      <li class="index__item" style="--i:6"><span class="index__n">06</span><span class="index__name">Cut</span></li>
      <li class="index__item" style="--i:7"><span class="index__n">07</span><span class="index__name">Slices</span></li>
      <li class="index__item" style="--i:8"><span class="index__n">08</span><span class="index__name">Pads</span></li>
    </ol>
  </div>

  <div class="controls">
    <button class="trigger" id="laserIt" type="button">
      <span class="trigger__label" id="triggerLabel">Laser it</span>
      <span class="trigger__meta" id="triggerMeta">cut 8</span>
      <span class="trigger__charge" aria-hidden="true"></span>
    </button>
    <p class="hint" id="hint">One pass. Eight layers. Station opens along its own seams.</p>
  </div>

</main>

<script src="scripts/laser.js" defer></script>
</body>
</html>
